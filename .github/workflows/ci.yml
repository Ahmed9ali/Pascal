name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./... || true
      - name: Test
        run: go test -skip 'TestCoderAgent|TestRunStopsOnTerminationSignal|TestRespawnKeepsPreviousServerOutput' -timeout 15m ./...
